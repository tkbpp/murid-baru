<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Murid Baru TK (Siap Dapodik)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-indigo-600 text-white py-6 shadow-md mb-8">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-3xl font-bold">Penerimaan Peserta Didik Baru (PPDB) TK</h1>
            <p class="text-indigo-200 mt-1">Sistem Pendataan Terintegrasi Cloud & Format Ekspor Impor Dapodik</p>
        </div>
    </header>

    <div class="container mx-auto px-4 max-w-6xl">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Formulir Pendaftaran -->
            <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
                <h2 id="formTitle" class="text-xl font-bold mb-4 text-slate-800 flex items-center gap-2">
                    <i class="fas fa-user-plus text-indigo-600"></i> Form Pendaftaran
                </h2>
                <form id="studentForm" class="space-y-3">
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Lengkap</label>
                        <input type="text" id="nama" required class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Jenis Kelamin</label>
                        <select id="jk" required class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="">-- Pilih --</option>
                            <option value="L">Laki-laki (L)</option>
                            <option value="P">Perempuan (P)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">NIK (16 Digit)</label>
                        <input type="text" id="nik" maxlength="16" pattern="[0-9]{16}" placeholder="351234..." required class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Tempat Lahir</label>
                            <input type="text" id="tempatLahir" required class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal Lahir</label>
                            <input type="date" id="tglLahir" required class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Ibu Kandung</label>
                        <input type="text" id="ibuKandung" required class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Agama</label>
                            <select id="agama" required class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                                <option value="Islam">Islam</option>
                                <option value="Kristen">Kristen</option>
                                <option value="Katholik">Katholik</option>
                                <option value="Hindu">Hindu</option>
                                <option value="Budha">Budha</option>
                                <option value="Khonghucu">Khonghucu</option>
                                <option value="Lainnya">Lainnya</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Kewarganegaraan</label>
                            <select id="kewarganegaraan" required class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                                <option value="Indonesia (WNI)">Indonesia (WNI)</option>
                                <option value="WNA">WNA</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Alamat Jalan / RT RW</label>
                        <textarea id="alamat" rows="2" required class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Desa / Kelurahan</label>
                            <input type="text" id="desa" required class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Kecamatan</label>
                            <input type="text" id="kecamatan" required class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Kabupaten / Kota</label>
                            <input type="text" id="kabupaten" required class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Provinsi</label>
                            <input type="text" id="provinsi" required class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Rombel (Kelompok Belajar)</label>
                        <select id="rombel" required class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="">-- Pilih Rombel --</option>
                            <option value="A">A (Usia 4 - 5 Tahun)</option>
                            <option value="B">B (Usia 5 - 6 Tahun)</option>
                            <option value="KB">Kelompok Bermain (KB)</option>
                        </select>
                    </div>

                    <div class="flex gap-2">
                        <button type="submit" id="btnSubmit" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition-all shadow flex items-center justify-center gap-2">
                            <i class="fas fa-save"></i> Simpan Pendaftaran
                        </button>
                        <button type="button" id="btnCancel" class="w-1/3 mt-4 bg-slate-400 hover:bg-slate-500 text-white font-semibold py-2.5 rounded-lg transition-all shadow hidden">
                            Batal
                        </button>
                    </div>
                </form>
            </div>

            <!-- Tabel Data Murid -->
            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4">
                    <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                        <i class="fas fa-list text-indigo-600"></i> Data Pendaftar (Realtime Cloud)
                    </h2>
                    <button id="btnExport" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-2 shadow">
                        <i class="fas fa-file-excel"></i> Ekspor Format Dapodik
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs border-collapse">
                        <thead>
                            <tr class="bg-slate-100 text-slate-700 border-b">
                                <th class="p-2">No</th>
                                <th class="p-2">Nama Peserta Didik</th>
                                <th class="p-2">JK</th>
                                <th class="p-2">NIK</th>
                                <th class="p-2">TTL</th>
                                <th class="p-2">Ibu Kandung</th>
                                <th class="p-2">Rombel</th>
                                <th class="p-2 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="studentTable" class="divide-y text-slate-600">
                            <tr>
                                <td colspan="8" class="text-center p-4 text-slate-400">Memuat data dari server...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // =========================================================================
        // UBAH DENGAN KONFIGURASI FIREBASE ANDA SENDIRI
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCe5rYA2H3N-cai8EtpcpUcJNAeJRlsQHo",
            authDomain: "murid-baru.firebaseapp.com",
            databaseURL: "https://murid-baru-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "murid-baru",
            storageBucket: "murid-baru.firebasestorage.app",
            messagingSenderId: "629010432398",
            appId: "1:629010432398:web:f4dcad79d63d6feb27a4df",
            measurementId: "G-HH5TVJVK43"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const studentsRef = ref(db, 'students');

        let localStudentsData = {};
        let editingId = null; // Menyimpan ID data yang sedang diedit

        const btnSubmit = document.getElementById('btnSubmit');
        const btnCancel = document.getElementById('btnCancel');
        const formTitle = document.getElementById('formTitle');
        const studentForm = document.getElementById('studentForm');

        // Reset Mode Formulir ke Tambah
        function resetForm() {
            editingId = null;
            studentForm.reset();
            formTitle.innerHTML = '<i class="fas fa-user-plus text-indigo-600"></i> Form Pendaftaran';
            btnSubmit.innerHTML = '<i class="fas fa-save"></i> Simpan Pendaftaran';
            btnSubmit.className = 'w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition-all shadow flex items-center justify-center gap-2';
            btnCancel.classList.add('hidden');
        }

        btnCancel.addEventListener('click', resetForm);

        // 1. Simpan / Perbarui Data ke Firebase
        studentForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            btnSubmit.disabled = true;
            btnSubmit.innerText = editingId ? 'Memperbarui...' : 'Menyimpan...';

            const studentData = {
                nama: document.getElementById('nama').value,
                jk: document.getElementById('jk').value,
                nik: document.getElementById('nik').value,
                tempatLahir: document.getElementById('tempatLahir').value,
                tglLahir: document.getElementById('tglLahir').value,
                ibuKandung: document.getElementById('ibuKandung').value,
                agama: document.getElementById('agama').value,
                kewarganegaraan: document.getElementById('kewarganegaraan').value,
                alamat: document.getElementById('alamat').value,
                desa: document.getElementById('desa').value,
                kecamatan: document.getElementById('kecamatan').value,
                kabupaten: document.getElementById('kabupaten').value,
                provinsi: document.getElementById('provinsi').value,
                rombel: document.getElementById('rombel').value,
                updatedAt: new Date().toISOString()
            };

            if (editingId) {
                // Mode Edit Data
                const itemRef = ref(db, 'students/' + editingId);
                update(itemRef, studentData)
                    .then(() => {
                        alert('Data berhasil diperbarui!');
                        resetForm();
                    })
                    .catch((err) => alert('Gagal memperbarui data: ' + err.message))
                    .finally(() => btnSubmit.disabled = false);
            } else {
                // Mode Tambah Data Baru
                studentData.createdAt = new Date().toISOString();
                push(studentsRef, studentData)
                    .then(() => {
                        alert('Data berhasil disimpan ke Cloud Database!');
                        resetForm();
                    })
                    .catch((err) => alert('Gagal menyimpan data: ' + err.message))
                    .finally(() => btnSubmit.disabled = false);
            }
        });

        // 2. Baca Data Realtime dari Firebase
        onValue(studentsRef, (snapshot) => {
            const tbody = document.getElementById('studentTable');
            tbody.innerHTML = '';
            
            localStudentsData = snapshot.val() || {};

            if (!snapshot.exists()) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center p-4 text-slate-400">Belum ada data murid terdaftar.</td></tr>`;
                return;
            }

            let index = 1;
            for (let id in localStudentsData) {
                const s = localStudentsData[id];
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-2">${index++}</td>
                    <td class="p-2 font-semibold text-slate-800">${s.nama}</td>
                    <td class="p-2">${s.jk}</td>
                    <td class="p-2">${s.nik}</td>
                    <td class="p-2">${s.tempatLahir}, ${s.tglLahir}</td>
                    <td class="p-2">${s.ibuKandung}</td>
                    <td class="p-2"><span class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded font-medium">${s.rombel}</span></td>
                    <td class="p-2 text-center whitespace-nowrap">
                        <button data-id="${id}" class="btn-edit text-amber-600 hover:text-amber-800 p-1 mr-1" title="Edit">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button data-id="${id}" class="btn-delete text-rose-600 hover:text-rose-800 p-1" title="Hapus">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            }

            // Listener Tombol Edit
            document.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    startEditStudent(id);
                });
            });

            // Listener Tombol Hapus
            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    deleteStudent(id);
                });
            });
        });

        // 3. Masukkan Data ke Form untuk Ditingkatkan/Diedit
        function startEditStudent(id) {
            const s = localStudentsData[id];
            if (!s) return;

            editingId = id;
            document.getElementById('nama').value = s.nama || '';
            document.getElementById('jk').value = s.jk || '';
            document.getElementById('nik').value = s.nik || '';
            document.getElementById('tempatLahir').value = s.tempatLahir || '';
            document.getElementById('tglLahir').value = s.tglLahir || '';
            document.getElementById('ibuKandung').value = s.ibuKandung || '';
            document.getElementById('agama').value = s.agama || '';
            document.getElementById('kewarganegaraan').value = s.kewarganegaraan || '';
            document.getElementById('alamat').value = s.alamat || '';
            document.getElementById('desa').value = s.desa || '';
            document.getElementById('kecamatan').value = s.kecamatan || '';
            document.getElementById('kabupaten').value = s.kabupaten || '';
            document.getElementById('provinsi').value = s.provinsi || '';
            document.getElementById('rombel').value = s.rombel || '';

            // Ubah tampilan form
            formTitle.innerHTML = '<i class="fas fa-edit text-amber-500"></i> Edit Data Murid';
            btnSubmit.innerHTML = '<i class="fas fa-check"></i> Perbarui Data';
            btnSubmit.className = 'w-full mt-4 bg-amber-500 hover:bg-amber-600 text-white font-semibold py-2.5 rounded-lg transition-all shadow flex items-center justify-center gap-2';
            btnCancel.classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 4. Hapus Data
        function deleteStudent(id) {
            if (confirm('Apakah Anda yakin ingin menghapus data ini dari server?')) {
                const itemRef = ref(db, 'students/' + id);
                remove(itemRef);
                if (editingId === id) resetForm();
            }
        }

        // 5. Ekspor Data ke CSV
        document.getElementById('btnExport').addEventListener('click', () => {
            if (Object.keys(localStudentsData).length === 0) {
                alert('Tidak ada data untuk diekspor.');
                return;
            }

            let csvContent = "\uFEFF";
            const headers = [
                "Nama Peserta Didik", "Jenis Kelamin", "NISN", "NIK/No. KITAS",
                "Tempat Lahir", "Tanggal Lahir", "Agama & Kepercayaan",
                "Kewarganegaraan", "Alamat Jalan", "Desa/Kelurahan",
                "Kecamatan", "Kabupaten/Kota", "Provinsi", "Nama Ibu Kandung", "Rombel Saat Ini"
            ];
            
            csvContent += headers.join(",") + "\n";

            for (let id in localStudentsData) {
                const s = localStudentsData[id];
                let row = [
                    `"${s.nama}"`, `"${s.jk}"`, `""`, `"'${s.nik}"`,
                    `"${s.tempatLahir}"`, `"${s.tglLahir}"`, `"${s.agama}"`,
                    `"${s.kewarganegaraan}"`, `"${s.alamat}"`, `"${s.desa}"`,
                    `"${s.kecamatan}"`, `"${s.kabupaten}"`, `"${s.provinsi}"`,
                    `"${s.ibuKandung}"`, `"${s.rombel}"`
                ];
                csvContent += row.join(",") + "\n";
            }

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "Export_Siswa_Baru_TK_Format_Dapodik.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
